<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Cleaner | Legal</title>
<style>
  :root {
    --ink: #1a1c20;
    --ink-faint: #8a8f99;
    --line: #e4e6ea;
    --paper: #fbfbfa;
    --card: #ffffff;
    --accent: #2c6e63;
    --accent-soft: #eef5f3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, "Iowan Old Style", serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card { max-width: 460px; width: 100%; }
  .eyebrow {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 14px;
  }
  h1 { font-size: 34px; font-weight: 400; letter-spacing: -0.01em; margin-bottom: 10px; }
  .sub {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink-faint); font-size: 15px; margin-bottom: 36px;
  }
  a.row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    text-decoration: none;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 12px;
    font-size: 16px;
    font-weight: 500;
    transition: border-color 0.15s, transform 0.15s;
  }
  a.row:hover { border-color: var(--accent); transform: translateX(2px); }
  a.row .lang { color: var(--ink-faint); font-size: 13px; font-weight: 400; }
  a.row .arrow { color: var(--accent); }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Photo Cleaner</div>
    <h1>Legal &amp; Privacy</h1>
    <p class="sub">Documents for the Photo Cleaner Android app.</p>

    <a class="row" href="privacy.html">
      <span>Privacy Policy <span class="lang">English</span></span>
      <span class="arrow">→</span>
    </a>
    <a class="row" href="datenschutz.html">
      <span>Datenschutzerklärung <span class="lang">Deutsch</span></span>
      <span class="arrow">→</span>
    </a>
    <a class="row" href="impressum.html">
      <span>Impressum <span class="lang">Deutsch</span></span>
      <span class="arrow">→</span>
    </a>
  </div>
</body>
</html>
